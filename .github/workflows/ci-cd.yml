name: CI

# Bu iş akışı yalnızca test, imaj derleme ve (elle tetiklenen) dağıtım içindir.
# Botlar burada çalıştırılmaz: GitHub Actions koşucuları geçicidir, kalıcı disk
# ve kalıcı port yoktur; kabul edilebilir kullanım politikası da sürekli çalışan
# servis barındırmaya izin vermez.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Sunucuya dağıt (docker compose up -d --build)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testler (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Sözdizimi kontrolü
        run: |
          for file in server/index.js server/lib/*.js public/app.js tests/*.js; do
            node --check "$file"
          done
      - name: Sırlar sızıyor mu (kaba tarama)
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=data -E "PANEL_MASTER_KEY *= *[0-9a-fA-F]{64}" .; then
            echo "Depoda gerçek bir PANEL_MASTER_KEY var gibi görünüyor."; exit 1
          fi
      - name: Testler
        run: npm test

  image:
    name: Docker imajı derle
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Derle (yayınlamadan)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lumo-panel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Sunucuya dağıt (elle)
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH ile dağıt
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ]; then
            echo "DEPLOY_SSH_KEY / DEPLOY_HOST tanımlı değil; dağıtım atlandı."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh "${DEPLOY_USER:-deploy}@${DEPLOY_HOST}" \
            'cd /opt/lumo-panel && git pull --ff-only && docker compose up -d --build && docker compose ps'
