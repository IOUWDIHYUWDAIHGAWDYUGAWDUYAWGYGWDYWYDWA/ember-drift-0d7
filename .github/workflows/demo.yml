name: Canlı demo

# 5 saatlik döngüyle ayakta tutulan geçici panel.
#
# DİKKAT — bu kalıcı bir sunucu DEĞİLDİR:
#   * GitHub Actions koşucuları geçicidir; her turda yeni ve boş bir makine gelir.
#   * Panel verisi (botlar, tokenlar, dosyalar) actions/cache ile turlar arasında
#     taşınır ve PANEL_MASTER_KEY secret'ı sabit tutulur. Cache 7 gün
#     kullanılmazsa silinir; her turda ~2-4 dakikalık kesinti olur.
#   * GitHub'ın kabul edilebilir kullanım kuralları Actions'ı ilgisiz, sürekli
#     çalışan servisler için kullanmayı yasaklayabilir. 7/24 kesintisiz bot
#     barındırmak için repodaki Docker/systemd kurulumunu kalıcı bir sunucuda
#     kullanın.
#
# Gerekli secret'lar:
#   PANEL_MASTER_KEY       — 64 karakter hex; sabit kalmalı, yoksa şifreli veri açılamaz.
#   PANEL_ADMIN_PASSWORD   — panel yönetici parolası (en az 10 karakter).

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Panel kaç dakika açık kalsın? (1-350; zamanlanmış çalışmada 295)"
        type: number
        default: 30
      admin_password:
        description: "Yönetici parolası (boşsa PANEL_ADMIN_PASSWORD secret'ı kullanılır)"
        type: string
        default: ""
  schedule:
    # Her 5 saatte bir yeni tur; iş 295 dakika sürer, araya küçük bir boşluk kalır.
    - cron: "0 */5 * * *"

permissions:
  contents: read

concurrency:
  group: demo-live
  cancel-in-progress: true

jobs:
  demo:
    name: Panel demosu
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Veriyi geri yükle (cache)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lumo-data
          key: panel-data-${{ github.run_id }}
          restore-keys: panel-data-

      - name: cloudflared indir
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version

      - name: Paneli başlat, kurulumu tamamla ve botları başlat
        env:
          MASTER_KEY_SECRET: ${{ secrets.PANEL_MASTER_KEY }}
          ADMIN_PASSWORD_SECRET: ${{ secrets.PANEL_ADMIN_PASSWORD }}
          ADMIN_PASSWORD_INPUT: ${{ inputs.admin_password }}
        run: |
          set -euo pipefail

          export PANEL_MASTER_KEY="${MASTER_KEY_SECRET:-4c7e6b0a8839446dfc8e9b015e1281fa7b0493821049281a9482019482019482}"
          export PANEL_RESET_ON_KEY_MISMATCH=1
          export PANEL_PORT=8080
          export PANEL_HOST=127.0.0.1
          export PANEL_DATA_DIR="$RUNNER_TEMP/lumo-data"
          export PANEL_SERVERS_DIR="$RUNNER_TEMP/lumo-data/servers"
          export PANEL_BOT_DRIVER=local
          export PANEL_INSECURE_COOKIES=1
          export PANEL_ACCESS_LOG=1
          mkdir -p "$PANEL_DATA_DIR"

          nohup node server/index.js > "$RUNNER_TEMP/panel.log" 2>&1 &
          disown || true

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/api/health; then
            echo "=== PANEL BAŞLATILAMADI! GÜNLÜK (panel.log): ==="
            cat "$RUNNER_TEMP/panel.log" || true
            exit 1
          fi
          echo

          PASSWORD="$ADMIN_PASSWORD_INPUT"
          [ -z "$PASSWORD" ] && PASSWORD="$ADMIN_PASSWORD_SECRET"
          if [ "${#PASSWORD}" -lt 10 ]; then
            PASSWORD="therealvynex@hmet355"
          fi
          echo "PANEL_DEMO_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          CREDS="$(PASSWORD="$PASSWORD" node -e 'process.stdout.write(JSON.stringify({ username: "vynex", password: process.env.PASSWORD }))')"
          ORIGIN='Origin: http://127.0.0.1:8080'

          if curl -fsS http://127.0.0.1:8080/api/setup/status | grep -q '"needsSetup":true'; then
            curl -fsS -X POST http://127.0.0.1:8080/api/setup \
              -H 'Content-Type: application/json' -H "$ORIGIN" --data "$CREDS"
            echo
            echo "Yönetici hesabı oluşturuldu."
          else
            echo "Panel verisi geri yüklendi; kurulum zaten tamam."
          fi

          if ! curl -fsS -c "$RUNNER_TEMP/cookie.txt" -X POST http://127.0.0.1:8080/api/auth/login \
               -H 'Content-Type: application/json' -H "$ORIGIN" --data "$CREDS" > /dev/null; then
            echo "Uyarı: giriş yapılamadı (secret'taki parola panelde değiştirilmiş olabilir)."
          fi

          IDS="$(curl -fsS -b "$RUNNER_TEMP/cookie.txt" http://127.0.0.1:8080/api/servers \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write((JSON.parse(s).servers||[]).map(x=>x.id).join(" "))}catch{}})')" || IDS=""

          if [ -z "$IDS" ]; then
            echo "Kayıtlı sunucu yok; panel boş başladı."
          else
            for id in $IDS; do
              echo "başlatılıyor: $id"
              curl -fsS -b "$RUNNER_TEMP/cookie.txt" -X POST "http://127.0.0.1:8080/api/servers/$id/power" \
                -H 'Content-Type: application/json' -H "$ORIGIN" -d '{"action":"start"}' || echo "  başlatılamadı: $id"
              echo
            done
          fi

      - name: Tüneli aç ve adresi yayınla
        if: always()
        run: |
          set -euo pipefail

          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8080 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          disown || true

          URL=""
          for _ in $(seq 1 45); do
            URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" 2>/dev/null | head -1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Tünel adresi alınamadı. cloudflared günlüğü:"
            cat "$RUNNER_TEMP/cloudflared.log" || true
            exit 1
          fi

          curl -fsS -o /dev/null -w "tünel sağlık kontrolü: HTTP %{http_code}\n" "$URL/api/health" || true

          printf 'adres=%s\nkullanici=vynex\nparola=%s\n' "$URL" "${PANEL_DEMO_PASSWORD:-?}" > "$RUNNER_TEMP/demo-bilgi.txt"

          {
            echo "## 🌐 Lumo Panel — canlı demo"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Adres** | $URL |"
            echo "| **Kullanıcı** | \`vynex\` |"
            echo "| **Parola** | \`${PANEL_DEMO_PASSWORD:-?}\` |"
            echo "| **Bu tur** | ${{ github.event_name == 'schedule' && '295 dakika (zamanlanmış)' || format('{0} dakika (elle)', inputs.duration_minutes) }} |"
            echo
            echo "> Turlar arasında panel verisi cache'ten geri yüklenir; her yenilenmede birkaç dakikalık kesinti olur."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Panel demo adresi::$URL"

      - name: Adresi artifact olarak yayınla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-bilgi
          path: ${{ runner.temp }}/demo-bilgi.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Süre boyunca açık tut
        if: success()
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            minutes=295
          else
            minutes="${{ inputs.duration_minutes }}"
            case "$minutes" in ''|*[!0-9]*) minutes=30 ;; esac
          fi
          [ "$minutes" -lt 1 ] && minutes=1
          [ "$minutes" -gt 350 ] && minutes=350
          echo "Panel $minutes dakika açık kalacak (https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          sleep $((minutes * 60))

      - name: Kapat
        if: always()
        run: |
          pkill -f cloudflared || true
          pkill -f "node server/index.js" || true
          sleep 2
          echo "Panel kapatıldı."

      - name: Veriyi kaydet (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/lumo-data
          key: panel-data-${{ github.run_id }}
