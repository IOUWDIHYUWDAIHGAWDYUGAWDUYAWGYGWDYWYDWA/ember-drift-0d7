# Lumo Panel — üretim kurulumu.
#
# Kritik nokta: panel bot konteynerlerini host'un Docker soketi üzerinden
# başlatır. `docker run -v <yol>` komutundaki yol HOST'ta geçerli olmalıdır,
# bu yüzden sunucu dizini host'ta ve panel konteynerinde AYNI mutlak yolda
# mount edilir (LUMO_DIR).
#
#   LUMO_DIR=/opt/lumo-panel docker compose up -d
#
# .env içinde: PANEL_MASTER_KEY, LUMO_DIR, PANEL_TRUST_PROXY=1

services:
  panel:
    build: .
    image: lumo-panel:0.2
    container_name: lumo-panel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PANEL_DATA_DIR: /data
      PANEL_SERVERS_DIR: ${LUMO_DIR:-/opt/lumo-panel}/servers
      PANEL_BOT_DRIVER: docker
      PANEL_TRUST_PROXY: "1"
      PANEL_PORT: "8080"
      PANEL_HOST: 0.0.0.0
    ports:
      # Doğrudan dışarı açmak yerine ters proxy (Caddy) arkasında tut:
      # portu 127.0.0.1'e bağla ve HTTPS'i proxy'ye bırak.
      - "127.0.0.1:8080:8080"
    volumes:
      - ${LUMO_DIR:-/opt/lumo-panel}/data:/data
      # Panel bu yolu host'a `docker run -v` ile geri verir: iki tarafta da aynı olmalı.
      - ${LUMO_DIR:-/opt/lumo-panel}/servers:${LUMO_DIR:-/opt/lumo-panel}/servers
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker soketini root olmayan kullanıcıyla kullanacaksan bunun yerine:
      # group_add:
      #   - "${DOCKER_GID:-999}"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
